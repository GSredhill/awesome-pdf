name: Lint

on:
  push:
    paths:
      - '**.md'
      - '.github/workflows/lint.yml'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Check readme follow conventions
      run: npx awesome-lint@2.3.0 ./README.md

    
